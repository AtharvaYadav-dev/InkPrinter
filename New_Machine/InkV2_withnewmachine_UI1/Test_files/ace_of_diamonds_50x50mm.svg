<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="50mm" viewBox="0 0 50 50">
  <defs>
    <!-- Geometric clean Diamond (no self-intersections, no sharp mitre issues) -->
    <path id="diamond" d="M 0,-5.5 L 4.0,0 L 0,5.5 L -4.0,0 Z"/>
    
    <!-- Vector path for Letter 'A' (printable by G-code slicer, not text tag) -->
    <path id="letterA" d="M -0.35,-2.1 L 0.35,-2.1 L 1.45,1.7 L 1.75,1.7 L 1.75,2.1 L 0.75,2.1 L 0.75,1.7 L 1.05,1.7 L 0.78,0.7 L -0.78,0.7 L -1.05,1.7 L -0.75,1.7 L -0.75,2.1 L -1.75,2.1 L -1.75,1.7 L -1.45,1.7 Z M 0,-1.2 L 0.6,0.3 L -0.6,0.3 Z"/>
  </defs>

  <!-- Card outside frame with rounded corners -->
  <rect x="9.2" y="0.5" width="31.6" height="49"
        rx="2.25" ry="2.25"
        fill="none" stroke="#000000" stroke-width="0.38"/>

  <!-- Top-left corner index (Red Letter A + small Red Diamond) -->
  <g fill="#d40000" stroke="none">
    <use href="#letterA" transform="translate(12.2 5.0)"/>
    <use href="#diamond" transform="translate(12.2 8.8) scale(0.35)"/>
  </g>

  <!-- Center large Diamond -->
  <use href="#diamond" fill="#d40000" stroke="none" transform="translate(25 25) scale(1.0)"/>

  <!-- Bottom-right corner index (rotated 180 degrees around card center) -->
  <g transform="rotate(180 25 25)" fill="#d40000" stroke="none">
    <use href="#letterA" transform="translate(12.2 5.0)"/>
    <use href="#diamond" transform="translate(12.2 8.8) scale(0.35)"/>
  </g>
</svg>